<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Photo submission</title>
    <style>
      :root {
        --bg: #111;
        --fg: #f7f3e8;
        --accent: #fd5a1e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
        padding: 1.5rem;
        max-width: 32rem;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.35rem;
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input[type="file"],
      input[type="text"],
      textarea {
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.5rem 0.6rem;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: var(--fg);
      }
      textarea {
        min-height: 4rem;
        resize: vertical;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.65rem 1.1rem;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #111;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .hint {
        font-size: 0.85rem;
        opacity: 0.85;
        margin-top: 0.35rem;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 8px;
        display: none;
      }
      .msg.show {
        display: block;
      }
      .msg.ok {
        background: rgba(80, 160, 80, 0.25);
        border: 1px solid rgba(120, 200, 120, 0.4);
      }
      .msg.err {
        background: rgba(180, 60, 60, 0.25);
        border: 1px solid rgba(220, 100, 100, 0.4);
      }
    </style>
  </head>
  <body>
    <h1>Submit a photo</h1>
    <p class="hint">
      This page is not linked from the main site. Images are reviewed before they may appear in
      the background collage. Max 5&nbsp;MB, images only.
    </p>

    <form id="form" novalidate>
      <label for="file">Photo file *</label>
      <input id="file" name="file" type="file" accept="image/*" required />

      <label for="displayName">Display name (optional)</label>
      <input
        id="displayName"
        name="displayName"
        type="text"
        maxlength="120"
        autocomplete="nickname"
        placeholder="First name or nickname"
      />

      <label for="caption">Caption (optional)</label>
      <textarea id="caption" name="caption" maxlength="500" placeholder="Short note"></textarea>

      <button type="submit" id="submitBtn">Upload</button>
    </form>

    <div id="msgOk" class="msg ok" role="status"></div>
    <div id="msgErr" class="msg err" role="alert"></div>

    <script type="module" src="./photo-submit.js"></script>
  </body>
</html>
